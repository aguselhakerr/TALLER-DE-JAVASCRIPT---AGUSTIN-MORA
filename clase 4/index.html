<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 4</title>
    <link rel="stylesheet" href="/clase 4/styles.css">
</head>
<body>
    <h1>Botones</h1>
    <form>
        <div class="mb-3" id="contenedor1">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3" id="contenedor2">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div class="mb-3 form-check" id="contenedor3">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>

        
    </form>
    <h3>Boton 1</h3>
    <button type="button" class="btn btn-outline-info">Info</button>

    <h3>Boton link</h3>
    <a href="https://www.mendozashopping.com/" class="btn btn-outline-info" tabindex="-1" role="button" aria-disabled="true" target="_blank">Visit Shopping</a>

    <p id="parrafo">Resultado</p>
    <script src="script.js"></script>
</body>
</html>
